name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../requirements/development.txt
      - name: Compile backend
        run: python -m compileall apps config
      - name: Lint backend
        run: python -m flake8 apps config --count
      - name: Test backend
        working-directory: .
        run: python -m pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  # Прод собирает фронт НЕ через npm, а через bun (docker/Dockerfile.frontend),
  # и с флагом --frozen-lockfile. Поэтому npm-локфайла в CI недостаточно:
  # 7 августа добавили @sentry/react и @playwright/test, обновили только
  # package-lock.json — CI остался зелёным, а прод-сборка фронтенда упала и
  # падала четыре раза подряд. Клиенты всё это время видели версию от 7 августа.
  #
  # Эта джоба воспроизводит ровно тот шаг, который падал. Ставить её ПОСЛЕ
  # frontend бессмысленно — она проверяет другое и должна идти параллельно.
  frontend-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: bun.lockb must match package.json
        run: NODE_ENV=development bun install --frozen-lockfile
