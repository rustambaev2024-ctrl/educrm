<!DOCTYPE html>
<!-- NOT a Django/Jinja template — resolved via literal string substitution in exporters.py, only these exact __PLACEHOLDER__ tokens are replaced -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { font-family: sans-serif; font-size: 12px; color: #111; }
  h1 { font-size: 16px; margin-bottom: 4px; }
  .meta { margin-bottom: 16px; color: #444; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 24px; }
  th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
  th { background: #f2f2f2; }
  .amount { text-align: right; }
  .total-row td { font-weight: bold; border-top: 2px solid #333; }
  .signature { margin-top: 48px; display: flex; justify-content: space-between; }
  .signature-line { border-top: 1px solid #333; width: 220px; padding-top: 4px; text-align: center; }
</style>
</head>
<body>
  <h1>Акт сверки взаиморасчётов</h1>
  <div class="meta">
    <div>Ученик: __STUDENT_NAME__</div>
    <div>Период: __DATE_FROM__ — __DATE_TO__</div>
    <div>Начальный баланс: __OPENING_BALANCE__ сум</div>
  </div>
  <table>
    <thead>
      <tr><th>Дата</th><th>Операция</th><th class="amount">Сумма</th><th class="amount">Баланс</th></tr>
    </thead>
    <tbody>
      __ROWS_TABLE_BODY__
      <tr class="total-row">
        <td colspan="3">Итоговый баланс</td>
        <td class="amount">__CLOSING_BALANCE__ сум</td>
      </tr>
    </tbody>
  </table>
  <div class="signature">
    <div class="signature-line">Бухгалтер: __ACCOUNTANT_NAME__</div>
    <div class="signature-line">Подпись ученика/родителя</div>
  </div>
</body>
</html>
